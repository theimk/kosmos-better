[package]
name = "kosmos2"
version = "0.1.0"
edition = "20240"

[dependencies]
wgpu

[dependencies.conquer-once]
version = "0.2.0"
default-features = false

[dependencies.futures-util]
version = "0.3.4"
default-features = false
features = ["alloc"]

[dependencies.crossbeam-queue]
version = "0.3.11"
default-features = false
features = ["alloc"]

[lib]
name = "kosmos"
path = "src/kernel.rs"
crate-type = ["staticlib"]

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
